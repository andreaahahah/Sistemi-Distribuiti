<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiNews Cloud Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
    <div class="masthead-top">
        <span class="masthead-date" id="today-date"></span>
        <a href="#" class="masthead-logo" id="logo-home">Wiki<span>News</span> ☁</a>
        <button class="btn-home" id="btn-clear">← Home</button>
    </div>
    <p class="masthead-tagline">Cloud Explorer · Archivio Wikimedia · NLP</p>
</header>

<div class="search-section">
    <form id="form-search" style="display: flex; width: 100%; gap: 10px;">
        <input class="search-input" type="text" id="searchInput"
               placeholder="Cerca una keyword estratta dal NLP (es. wikipedia, sicilia, cultura...)">
        <button class="btn-search" type="submit" id="btn-search">Cerca</button>
    </form>
</div>

<div class="main-grid">

    <aside class="sidebar">
        <div>
            <p class="sidebar-section-title">Estrazione Automatica</p>
            <form id="form-upload-auto">
                <label class="form-label-small">URL Articolo Wikimedia</label>
                <input class="field-input" type="url" id="urlInput" placeholder="https://www.wikimedia.it/news/...">
                <button class="btn-sidebar btn-sidebar-green" type="submit" id="btn-auto">Estrai e Salva</button>
            </form>
        </div>
        <div>
            <p class="sidebar-section-title">Inserimento Manuale</p>
            <form id="form-upload-manual">
                <label class="form-label-small">Titolo</label>
                <input class="field-input" type="text" id="manualTitle">
                <label class="form-label-small">Data</label>
                <input class="field-input" type="date" id="manualDate">
                <label class="form-label-small">Autore</label>
                <input class="field-input" type="text" id="manualAuthor">
                <label class="form-label-small">Contenuto</label>
                <textarea class="field-input" id="manualContent" rows="4"></textarea>
                <button class="btn-sidebar btn-sidebar-dark" type="submit" id="btn-manual">Salva Manualmente</button>
            </form>
        </div>
    </aside>

    <main class="content-area">
        <div id="alert-container"></div>
        <div class="content-header">
            <h2 class="results-title">Risultati</h2>
            <span class="results-count" id="results-count"></span>
        </div>
        <div id="results-container">
            <div class="empty-state">
                <span class="empty-state-icon">🔍</span>
                Usa la barra di ricerca per interrogare il database.
            </div>
        </div>
    </main>

</div>

<div class="modal-overlay" id="articleModal" role="dialog" aria-modal="true" aria-labelledby="articleModalLabel">
    <div class="modal-box">
        <div class="modal-header">
            <h2 class="modal-title" id="articleModalLabel"></h2>
            <p class="modal-meta" id="articleModalMeta"></p>
            <button class="modal-close" id="modal-close-btn" aria-label="Chiudi">✕</button>
        </div>
        <div class="modal-body">
            <img id="articleModalImage" src="" class="modal-image" alt="" style="display:none;">
            <div class="modal-content-text" id="articleModalContent"></div>
            <div class="modal-source" id="articleModalSourceDiv" style="display:none;">
                Fonte originale:
                <a href="#" id="articleModalLink" target="_blank" rel="noopener">Visita la pagina Wikimedia →</a>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-modal-close" id="modal-footer-close">Chiudi</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
