<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikimedia Cloud Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .keyword-badge { margin-right: 5px; margin-bottom: 5px; }
        .article-card { transition: transform 0.2s; }
        .article-card:hover { transform: translateY(-5px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-5 text-primary">☁️ WikiNews Cloud Explorer</h1>

    <div class="row">
        <div class="col-md-4">

            <div class="card mb-4 shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Estrazione Automatica</h5>
                </div>
                <div class="card-body">
                    <form id="form-upload-auto">
                        <div class="mb-3">
                            <label for="urlInput" class="form-label">URL Articolo Wikimedia</label>
                            <input type="url" class="form-control" id="urlInput" placeholder="https://www.wikimedia.it/news/..." required>
                        </div>
                        <button type="submit" class="btn btn-success w-100" id="btn-auto">Estrai e Salva</button>
                    </form>
                </div>
            </div>

            <div class="card mb-4 shadow-sm">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0">Inserimento Manuale</h5>
                </div>
                <div class="card-body">
                    <form id="form-upload-manual">
                        <div class="mb-3">
                            <label class="form-label">Titolo</label>
                            <input type="text" class="form-control" id="manualTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Data (es. 2026-03-21)</label>
                            <input type="date" class="form-control" id="manualDate">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Autore</label>
                            <input type="text" class="form-control" id="manualAuthor">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contenuto</label>
                            <textarea class="form-control" id="manualContent" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-secondary w-100" id="btn-manual">Salva Manualmente</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <form id="form-search" class="d-flex">
                        <input class="form-control me-2 form-control-lg" type="search" id="searchInput" placeholder="Cerca una keyword estratta dal NLP (es. wikipedia, sicilia...)" required>
                        <button class="btn btn-primary btn-lg" type="submit" id="btn-search">Cerca</button>
                    </form>
                </div>
            </div>

            <div id="alert-container"></div>

            <h4 class="mb-3">Risultati della Ricerca</h4>
            <div id="results-container" class="row">
                <div class="col-12 text-muted">
                    <em>Usa la barra di ricerca qui sopra per interrogare il database.</em>
                </div>
            </div>
        </div>
    </div>

</div>
<div class="modal fade" id="articleModal" tabindex="-1" aria-labelledby="articleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="articleModalLabel">Titolo Articolo</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">

                <img id="articleModalImage" src="" class="img-fluid w-100 mb-3 rounded shadow-sm" style="display: none; max-height: 400px; object-fit: cover;" alt="Immagine articolo">

                <p class="text-muted mb-4 border-bottom pb-2" id="articleModalMeta">Data | Autore | Metodo</p>

                <div id="articleModalContent" style="font-size: 1.1em; line-height: 1.6;">
                    </div>

                <div class="mt-4 pt-3 border-top" id="articleModalSourceDiv" style="display: none;">
                    <strong>Fonte originale:</strong> <a href="#" id="articleModalLink" target="_blank">Visita la pagina di Wikimedia</a>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="app.js"></script>
</body>
</html>
